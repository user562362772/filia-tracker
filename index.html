<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Registro">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>

  <nav class="tabs">
    <button id="t-hoy" class="on">Hoy</button>
    <button id="t-cal">Calendario</button>
  </nav>

  <!-- ============ VISTA: HOY ============ -->
  <div id="v-hoy">

    <div class="card hero">
      <div class="mut" id="dlabel"></div>
      <div class="btns" id="btns"></div>          <!-- botones A, B, C (los crea app.js) -->
      <div class="mut" id="sincel" style="margin-top:16px"></div>
      <div class="since" id="since"></div>        <!-- tiempo desde el último C -->
    </div>

    <div class="card">
      <h2>Estadísticas</h2>
      <table id="stats"></table>
    </div>

    <div class="card">
      <h2>Semana</h2>
      <div id="list"></div>
    </div>

    <div class="card">
      <h2>Copia de seguridad</h2>
      <div class="row">
        <button id="exp">Copiar datos</button>
        <button id="imp">Importar</button>
      </div>
      <textarea id="bk" rows="3" placeholder="Pega aquí tus datos para importarlos" style="margin-top:10px"></textarea>
    </div>

  </div>

  <!-- ============ VISTA: CALENDARIO ============ -->
  <div id="v-cal" hidden>

    <div class="card">
      <div class="row" style="align-items:center">
        <button id="cprev" aria-label="Mes anterior">‹</button>
        <b id="cmon" style="text-align:center;text-transform:capitalize;flex:3"></b>
        <button id="cnext" aria-label="Mes siguiente">›</button>
      </div>
      <div class="hd"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="cal" id="cal"></div>
      <div class="leg" id="leg"></div>
    </div>

      <div class="card">
        <h2>Añadir entrada manual</h2>
         <div class="row">
        <select id="mtype" style="flex:0 0 72px"></select>
        <input id="mdate" type="datetime-local">
      </div>
        <button id="madd" style="width:100%;margin-top:10px">Añadir</button>
      </div>

    <div class="card"><h2 id="dtitle"></h2><div id="dinfo"></div></div>
    <div class="card"><h2>Resumen del mes</h2><div id="msum"></div></div>

  </div>

</main>
<script src="app.js"></script>
</body>
</html>
